        // Calculate stats on load
        window.addEventListener('load', () => {
            const total = Object.keys(decisions).length;
            const ach = Object.values(decisions).filter(d => d.status === 'ach').length;
            const mail = Object.values(decisions).filter(d => d.status === 'mail').length;

            document.getElementById('totalChecks').textContent = total;
            document.getElementById('achCount').textContent = ach;
            document.getElementById('mailCount').textContent = mail;
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function importDecisions() {
            try {
                localStorage.setItem('check_auditor_decisions', JSON.stringify(decisions));
                showMessage(`✅ Successfully imported ${Object.keys(decisions).length} check decisions!`, 'success');
            } catch (err) {
                showMessage('❌ Error importing decisions: ' + err.message, 'error');
            }
        }

        function viewDecisions() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '<h3>Current Decisions:</h3><pre>' + JSON.stringify(decisions, null, 2) + '</pre>';
        }

        function clearDecisions() {
            if (confirm('Are you sure you want to clear ALL saved decisions?')) {
                localStorage.removeItem('check_auditor_decisions');
                showMessage('🗑️ All decisions cleared', 'success');
            }
        }

        function downloadJSON() {
            const dataStr = JSON.stringify(decisions, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'check_decisions_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function openCheckAuditor() {
            window.open('https://richrock27.github.io/check-auditor/', '_blank');
